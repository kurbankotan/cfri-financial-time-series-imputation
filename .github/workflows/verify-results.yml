name: Verify published results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.16.3

      - name: Historical ITRI development ablation
        run: python scripts/verify_published_results.py

      - name: Historical development comparators (Supplementary Tables S8 and S9)
        run: python development_comparators/verify_comparator_numbers.py

      - name: Historical external validation (Supplementary Tables S10 to S18)
        run: python external_validation/code/verify_reported_numbers.py

      - name: CFRI folds A to C and fold D (main Table 1)
        run: python cfri_confirmatory/analysis/verify_reported_numbers.py

      - name: CFRI fold D supplementary tables (Supplementary Tables S19 to S22)
        run: python cfri_confirmatory/analysis/fold_D_supplement.py --out "$RUNNER_TEMP/supplement_fold_D"

      - name: CFRI new-asset holdout (main Table 2, Supplementary Tables S23 to S25)
        run: python cfri_holdout_v1/analysis/verify_reported_numbers.py

      - name: CFRI candle exploratory artifact integrity
        run: python cfri_candle_v1_exploratory/verify_package.py
