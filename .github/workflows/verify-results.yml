name: Verify CFRI manuscript evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install numerical verification dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.16.3

      - name: Verify canonical file hashes and article figure assets
        run: python scripts/verify_manifest.py

      - name: Historical ITRI development archive
        run: python scripts/verify_published_results.py

      - name: Historical comparator archive
        run: python development_comparators/verify_comparator_numbers.py

      - name: Historical ITRI external-validation archive
        run: python external_validation/code/verify_reported_numbers.py

      - name: CFRI fold D main Table 1 and Supplementary Tables S1–S4
        run: python cfri_confirmatory/analysis/verify_reported_numbers.py

      - name: CFRI main Figure 2 and Supplementary Figure S1 source data
        run: python cfri_confirmatory/analysis/fold_D_supplement.py --out "$RUNNER_TEMP/supplement_fold_D"

      - name: CFRI main Table 2 and Supplementary Tables S5–S7
        run: python cfri_holdout_v1/analysis/verify_reported_numbers.py

      - name: CFRI Figure 3 source data
        run: python paper_figures/verify_cfri_figures.py

      - name: CFRI exploratory Supplementary Tables S8–S10
        run: python cfri_candle_v1_exploratory/verify_package.py
